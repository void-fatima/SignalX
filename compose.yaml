name: singnalx
x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://signalx:signalx@database:5432/signalx
  PROVIDER_MODE: ${PROVIDER_MODE:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.avalai.ir/v1}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
  OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2000}
  OPENAI_PRICE_VERSION: ${OPENAI_PRICE_VERSION:-}
  OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-}
  OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-singnalx_session}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-604800}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-120}
x-backend: &backend
  build: ./backend
  environment: *backend-environment
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalx
      POSTGRES_USER: signalx
      POSTGRES_PASSWORD: signalx
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalx -d signalx"]
      interval: 3s
      timeout: 3s
      retries: 20
  migration:
    <<: *backend
    environment:
      <<: *backend-environment
      OPENAI_API_KEY: ""
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migration: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migration: {condition: service_completed_successfully}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
